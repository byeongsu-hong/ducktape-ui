[package]
name = "iced-app"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "highlighter", "image", "lazy", "markdown", "qr_code", "selector", "sipper", "svg", "sysinfo", "tiny-skia", "tokio", "wgpu", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["pnm"] }
ui-lang = { path = "../../crates/ui-lang" }
ui-lang-runtime = { path = "../../crates/ui-lang-runtime", version = "=0.1.0" }

[build-dependencies]
ui-lang-build = { path = "../../crates/ui-lang-build", version = "=0.1.0" }

[dev-dependencies]
iced_runtime = "0.14.0"
iced_test = "=0.14.0"

[lints]
workspace = true
