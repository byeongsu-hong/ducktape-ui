[package]
name = "iced-app"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "highlighter", "image", "lazy", "markdown", "qr_code", "selector", "sipper", "svg", "sysinfo", "tiny-skia", "tokio", "wgpu", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["pnm"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true

[build-dependencies]
ui-lang-build.workspace = true

[dev-dependencies]
iced_runtime = "0.14.0"
iced_test = "=0.14.0"

[lints]
workspace = true
