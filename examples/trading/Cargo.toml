[package]
name = "trading-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
# Go renders a `[]byte` as base64, and a Lighter transaction carries its
# signature as one — so the body has to spell 80 bytes the way the sequencer
# reads them. Already in the lockfile as a transitive dependency, so naming it
# costs a line and no build time.
base64 = "0.22"
ui-lang-components = { workspace = true, features = ["candle-chart"] }
# Thomas Pornin's reference ECgFp5, pinned by revision. This is the
# implementation Lighter's own open signer cites as the design and first
# implementation of the curve, it has no dependencies of its own, and it is
# MIT. See the header of `src/lighter_sign.rs` for what a git dependency costs
# here and why it won over crates.io's `plonky2_ecgfp5` and vendoring.
ecgfp5 = { git = "https://github.com/pornin/ecgfp5", rev = "ce059c6d1e1662db437aecbf3db6bb67fe63c716" }
# Randomness for the agent key. Already in the tree as a transitive dependency,
# so naming it here costs a line and no build time.
getrandom = "0.3"
hex = "0.4"
# HMAC-SHA512, which is the whole of BIP-39's key stretching and BIP-32's child
# derivation. Both are already in the lockfile, so naming them costs a line and
# no build time — and between them and `k256` there is nothing left of a seed
# phrase that needs a dependency of its own.
hmac = "0.12"
iced = { version = "=0.14.0", features = ["smol"] }
# secp256k1 with public-key recovery, which is the whole of what an Ethereum
# r/s/v needs. Pure Rust, and it shares the sha2/digest/zeroize already in the
# lockfile; the C-binding alternative would drag a build script and a compiler.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
serde_json = "1"
sha2 = "0.10"
# keccak256. `sha2` is already here but SHA-3 and SHA-2 share nothing but a
# name; this is the same RustCrypto `digest` traits, so it adds one small crate.
sha3 = "0.10"
smol = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true
ureq = { version = "3", features = ["json"] }

# The Keychain, and only where there is one. `OSX_10_15` is not a nicety: it is
# the flag gating `use_protected_keychain`, and without the data-protection
# keychain macOS ignores `kSecAttrAccessible*` outright — see `src/session.rs`.
[target."cfg(target_os = \"macos\")".dependencies]
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_15"] }

[build-dependencies]
ui-lang-build.workspace = true

[lints.rust]
unsafe_code = "forbid"
