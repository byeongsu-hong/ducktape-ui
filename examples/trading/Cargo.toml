[package]
name = "trading-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
ducktape-ui = { workspace = true, features = ["candle-chart"] }
# Thomas Pornin's reference ECgFp5, pinned by revision. This is the
# implementation Lighter's own open signer cites as the design and first
# implementation of the curve, it has no dependencies of its own, and it is
# MIT. See the header of `src/lighter_sign.rs` for what a git dependency costs
# here and why it won over crates.io's `plonky2_ecgfp5` and vendoring.
ecgfp5 = { git = "https://github.com/pornin/ecgfp5", rev = "ce059c6d1e1662db437aecbf3db6bb67fe63c716" }
iced = { version = "=0.14.0", features = ["smol"] }
serde_json = "1"
smol = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true
ureq = { version = "3", features = ["json"] }

[build-dependencies]
ui-lang-build.workspace = true

[lints.rust]
unsafe_code = "forbid"
