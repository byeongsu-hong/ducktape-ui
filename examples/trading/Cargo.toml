[package]
name = "trading-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
ducktape-ui = { workspace = true, features = ["candle-chart"] }
iced = { version = "=0.14.0", features = ["smol"] }
serde_json = "1"
smol = "2"
tungstenite = { version = "0.30.0", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true
ureq = { version = "3", features = ["json"] }

# The Keychain, and only where there is one. `OSX_10_15` is not a nicety: it is
# the flag gating `use_protected_keychain`, and without the data-protection
# keychain macOS ignores `kSecAttrAccessible*` outright — see `src/session.rs`.
[target."cfg(target_os = \"macos\")".dependencies]
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_15"] }

[build-dependencies]
ui-lang-build.workspace = true

[lints.rust]
unsafe_code = "forbid"
