[package]
name = "markdown-example"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "smol", "tiny-skia", "wgpu", "x11"] }
iced_highlighter = "=0.14.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ui-lang.workspace = true
ui-lang-runtime.workspace = true
unicode-segmentation = "1"

[build-dependencies]
ui-lang-build.workspace = true

[lints]
workspace = true

[dev-dependencies]
ui-lang-runtime = { workspace = true, features = ["test-runtime"] }
