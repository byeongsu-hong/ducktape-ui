[package]
name = "app-store-sdk"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced.workspace = true
iced_runtime = "=0.14.0"
iced_tiny_skia = "=0.14.0"
ui-lang-runtime = { workspace = true, features = ["full-runtime"] }
app-store-frame.workspace = true

# winit and iced's executor check refuse a native Linux build with no
# platform selected; an app never opens a window either way.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { workspace = true, features = ["x11", "thread-pool"] }

[lints.rust]
unsafe_code = "forbid"
