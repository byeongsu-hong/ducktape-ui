# A separate workspace on purpose: the apps target wasm32 and the host pulls
# wasmtime, neither of which belongs in the root workspace's lockfile or CI.
# The wire and the guest runtime the apps are built on are workspace crates
# (`crates/ui-lang-wire`, `crates/ui-lang-guest`); only the apps, the host
# and their windows live here.
[workspace]
resolver = "2"
members = ["apps/todo", "apps/counter", "apps/clock", "apps/activity", "apps/chaos", "host"]

[workspace.dependencies]
ui-lang = { path = "../../crates/ui-lang" }
ui-lang-build = { path = "../../crates/ui-lang-build" }
ui-lang-runtime = { path = "../../crates/ui-lang-runtime", default-features = false }
ui-lang-wire = { path = "../../crates/ui-lang-wire" }
ui-lang-guest = { path = "../../crates/ui-lang-guest" }
# No renderer here: an app builds a node tree, never a picture, so it needs
# only iced's types. The host draws through `ui-lang-runtime`'s own
# software renderer feature.
iced = { version = "=0.14.0", default-features = false, features = ["advanced"] }

[patch.crates-io]
iced_tiny_skia = { path = "../../vendor/iced_tiny_skia" }
iced_winit = { path = "../../vendor/iced_winit" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# iced with no renderer feature runs on its null renderer (`()`), which
# exists only under `debug_assertions`, and `iced_renderer` refuses a
# release build without one. A guest draws nothing, so the null renderer is
# the right one in release too: these three crates keep the cfg on. The host
# is unaffected — it enables `tiny-skia` and never reaches the null path.
[profile.release.package.iced_core]
debug-assertions = true
[profile.release.package.iced_graphics]
debug-assertions = true
[profile.release.package.iced_renderer]
debug-assertions = true
