[package]
name = "app-store-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
iced = { workspace = true, features = ["smol"] }
ui-lang.workspace = true
ui-lang-runtime = { workspace = true, features = ["full-runtime"] }
ui-lang-wire = { workspace = true, features = ["manifest"] }
ui-lang-components = { path = "../../../crates/ui-lang-components", features = ["terminal"] }
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime", "cache", "parallel-compilation", "component-model"] }
sha2 = "0.10"
getrandom = "0.3"

# The windowing backends are Linux's; asking for them anywhere else fails the
# build before it starts.
[target.'cfg(target_os = "linux")'.dependencies]
iced = { workspace = true, features = ["x11", "wayland"] }
ui-lang-runtime = { workspace = true, features = ["x11"] }

# Ice's generated `#[cfg(test)]` glue calls the runtime's test driver, so
# building the host's own unit tests needs the feature that provides it. It
# is a dev-dependency: the shipped binary never links it.
[dev-dependencies]
wat = "1"
iced_test = "=0.14.0"
ui-lang-runtime = { workspace = true, features = ["test-runtime"] }

[[bin]]
name = "app-store-host"
path = "src/main.rs"

[build-dependencies]
ui-lang-build.workspace = true

[lints.rust]
unsafe_code = "forbid"
