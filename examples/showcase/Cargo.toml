[package]
name = "showcase"
version = "0.1.0"
edition.workspace = true
publish = false
# `cargo ice bundle` reads these: the description becomes the desktop entry's
# comment and the Debian synopsis, and the first author becomes the Debian
# maintainer and the Windows Installer manufacturer.
authors = ["byeongsu-hong <byeongsu-hong@users.noreply.github.com>"]
description = "The complete ducktape-ui component catalog, built with Ice."
homepage.workspace = true

# The bundle name and identifier come from the Ice app declaration; only what
# no standard Cargo or Ice field can express lives here.
[package.metadata.ice.bundle]
icon = "../../assets/icons/ice.svg"
category = "public.app-category.developer-tools"
copyright = "Copyright © 2026 ducktape-ui contributors. MIT licensed."

[dependencies]
ui-lang-components = { workspace = true, features = ["full"] }
iced = { version = "=0.14.0", features = ["smol"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true

[build-dependencies]
ui-lang-build.workspace = true

[dev-dependencies]
iced = { version = "=0.14.0", features = ["advanced", "canvas", "highlighter", "image", "lazy", "markdown", "qr_code", "selector", "sipper", "svg", "sysinfo", "tiny-skia", "tokio", "wgpu", "x11"] }
iced_runtime = "0.14.0"
iced_test = "=0.14.0"
image = { version = "0.25.10", default-features = false, features = ["pnm"] }
stats_alloc = "0.1.10"

[lints]
workspace = true
