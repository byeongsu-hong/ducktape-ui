[package]
name = "terminal-example"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
alacritty_terminal = { version = "=0.25.1", default-features = false }
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tokio", "wgpu", "x11"] }
shell-words = "=1.1.1"
tokio = { version = "=1.53.0", features = ["sync", "time"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true
which = "=8.0.5"

[build-dependencies]
ui-lang-build.workspace = true

[lints]
workspace = true
