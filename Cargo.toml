[workspace]
members = [
    "crates/ui-lang-core",
    "crates/ui-lang-runtime",
    "crates/ui-lang-template",
    "crates/ui-lang-build",
    "crates/ui-lang",
    "crates/cargo-ice",
    "crates/ui-lang-components",
    "examples/ai-chat",
    "examples/apple-music",
    "examples/candles",
    "examples/cef-browser",
    "examples/hotreload",
    "examples/markdown-editor",
    "examples/showcase",
    "examples/starter",
    "examples/terminal",
    "examples/tray",
    "examples/trading",
    "conformance/ice",
]
resolver = "3"
# A path dependency is not a member unless listed, and this one must not be:
# it is a patch over a published crate, not a crate of this workspace.
exclude = ["vendor/iced_tiny_skia", "vendor/iced_winit"]

# `vendor/iced_tiny_skia` is the published 0.14.0 source with the changes
# below: three defects fixed, one module opened, one present shortened and
# three repaints narrowed. Every one of them reaches every software render,
# which is what every headless capture, `cargo ice inspect` and any
# `tiny-skia` window draws with. Drop the directory and this patch when a
# release carries all of them.
#
# 1. It translates a canvas group's clip rectangle by the group's own
# transformation twice — once when the layer records it and again when the
# renderer draws it — so any `canvas` geometry drawn at an offset is clipped to
# a rectangle displaced by that offset: a chart in a scrolled page drew
# nothing, and the terminal's candle chart lost its left third in every
# capture. Upstream fixed it in iced-rs/iced@76b32d4906 ("Fix
# transformation of `canvas` primitives in `tiny_skia`"), which no 0.14 release
# carries; it is applied here as that commit.
#
# 2. It chooses a quad's clip mask from the quad's own bounds and then draws
# the shadow — a separate, larger rectangle — with no mask at all, so a quad
# well inside its clip paints outside it through an offset or a wide blur:
# over a neighbouring pane, a sidebar, or another app's window. The shadow now
# asks the same mask its own question. Not upstream; `crates/ui-lang-runtime`
# pins both behaviours (`tests/canvas_offset_clip.rs`,
# `tests/shadow_layer_clip.rs`).
#
# 3. `mod layer` is `pub`, so a renderer that records instead of presenting can
# walk the `Item` list it produced. `examples/app-store` draws a wasm guest's
# frame that way; nothing in this workspace reads it.
#
# 4. A present that changes nothing on the display returns before touching the
# buffer, and one that does hands the display server only the rectangles that
# differ from what it shows (`present_with_damage`), instead of the whole
# window every time. `examples/app-store` redraws every window after every
# update, so its idle windows presented a full copy each tick.
#
# 5. It records a `canvas` text with an infinite clip rectangle. Finding what
# a changed text damaged multiplies that rectangle by the layer's
# transformation, and a 4x4 multiply turns an infinite size into a NaN one
# (`0.0 * f32::INFINITY`); a NaN rectangle loses no comparison, so a chart
# label whose number changed asked for the whole window. The frame's own
# rectangle is recorded instead — the group already carries the same clip, so
# nothing is drawn differently. Pinned by
# `crates/ui-lang-runtime/tests/canvas_text_damage.rs`.
#
# 6. A quad crossing the region being repainted is filled over that region,
# one pixel wider so the mask still cuts the edge, instead of over the whole
# quad — a rounded one too, as long as the part being filled holds none of
# the corner squares it curves inside of, since the shape is its own
# rectangle everywhere else. A window's background quad cost its full area on
# every partial repaint.
#
# 7. A glyph that rasterises to nothing — every space — is kept in the glyph
# cache like any other. Learning that it is empty means hinting its outline,
# and without the entry that ran again for every space on every draw.
#
# 8. A glyph decides for itself whether the clip mask applies to it. The
# release decided once per text, comparing the text's own clip rectangle with
# the region being repainted, so a text clipped to a whole window had every
# one of its glyphs blitted through the mask on every partial repaint. A
# glyph inside the region is now drawn without the mask and one outside it is
# skipped; the mask is that rectangle filled without anti-aliasing, so it is
# 255 over the first and 0 over the second and neither changes a pixel.
#
# `vendor/iced_winit` is the published 0.14.0 source with one line changed:
# the event loop no longer keeps a `WaitUntil` deadline that has already
# passed when a later one is asked for. Kept, it made winit poll with a zero
# timeout until the later deadline arrived, so a daemon with two windows that
# each ask for a timed redraw spun a whole core. Upstream master still has
# the original line; drop the directory and the patch when a release does not.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
iced_winit = { path = "vendor/iced_winit" }

[workspace.package]
edition = "2024"
homepage = "https://github.com/byeongsu-hong/ducktape-ui"
license = "MIT"
repository = "https://github.com/byeongsu-hong/ducktape-ui"
rust-version = "1.88"

[workspace.dependencies]
ui-lang-components = { path = "crates/ui-lang-components", version = "=0.1.0" }
ui-lang = { path = "crates/ui-lang", version = "=0.1.0" }
ui-lang-build = { path = "crates/ui-lang-build", version = "=0.1.0" }
ui-lang-core = { path = "crates/ui-lang-core", version = "=0.1.0" }
ui-lang-runtime = { path = "crates/ui-lang-runtime", version = "=0.1.0" }
ui-lang-template = { path = "crates/ui-lang-template", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Debug info stays complete but lives beside the binary instead of inside it.
# Copying it in was the larger half of every dev link: showcase relinks 0.6s
# faster and its binary drops from 443MB to 158MB.
#
# `lto = "off"` is not the default (`false`): the default omits the flag, and
# rustc then runs *local* ThinLTO across a crate's codegen units whenever its
# opt-level is above zero — which trading-example's stanza below sets. On the
# 2026-08-12 crate that pass was 23.2s of a 28.2s `.ice`-edit rebuild
# (`-Ztime-passes`: LLVM_thinlto), and turning it off took the measured edit
# from 24.5s to 3.7s while the dense-terminal `frame_cost` moved ~1.8%
# (4433us -> 4514us idle-redraw p50, interleaved on one box) — inside the
# probe's own ~0.5ms cross-binary noise floor. Crates at opt-level 0 never
# ran the pass, so this changes nothing else in dev.
[profile.dev]
split-debuginfo = "unpacked"
lto = "off"

[profile.dev.package.music-example]
debug = 0

# `cargo run -p trading-example` is a debug build, and a debug frame on the
# terminal's densest screen was 11221us of build and layout against release's
# 3.3ms — the one reading in `docs/testing.md` with no headroom at 60Hz. This
# took it to 7155us. "Takes back nothing" was true of the crate it was
# measured on (a 2.51s edit rebuild against 2.58s at opt-level 0); the crate
# has since grown into the full HTS, and at this opt-level rustc's local
# ThinLTO pass came to dominate the edit loop — see `lto = "off"` above,
# which keeps this stanza's frame win and returns the edit loop to seconds.
#
# `[profile.dev.package."*"] opt-level = 2` was measured on top of this and
# rejected. It takes the frame a further 0.82x, because a frame is iced's
# generic widget machinery monomorphized into the crate that *instantiates* it
# — this one — and a monomorphization is codegen'd at the instantiating crate's
# opt-level, not at iced's. So most of the frame is already here. What the
# dependency stanza does cost is every job in CI: on run 31359419019 `Rust and
# Ice` went 7m12s to 22m20s against a 30-minute cap, and every other dev job
# roughly tripled, because sccache misses everything on the changed flags.
[profile.dev.package.trading-example]
opt-level = 1

# Whole-program optimization pays twice here: showcase ships at 20.5MB instead
# of 33.0MB, and every frame phase drops 11-13% with p95 tightening 18% — the
# generated view is thousands of tiny calls into iced, which is exactly what
# cross-crate inlining is for. Release builds take 2.2x longer; nothing in the
# edit loop uses this profile, and the one CI job that does grows by a minute.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
