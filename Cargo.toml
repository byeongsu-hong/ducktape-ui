[workspace]
members = [
    "crates/ui-lang-core",
    "crates/ui-lang-runtime",
    "crates/ui-lang-build",
    "crates/ui-lang",
    "crates/cargo-ice",
    "crates/ui",
    "examples/apple-music",
    "examples/cef-browser",
    "examples/iced-app",
    "examples/markdown-editor",
    "examples/showcase",
    "examples/terminal",
    "conformance/ice",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package.music-example]
debug = 0
