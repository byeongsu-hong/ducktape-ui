[workspace]
members = [
    "crates/ui-lang-core",
    "crates/ui-lang-runtime",
    "crates/ui-lang-template",
    "crates/ui-lang-build",
    "crates/ui-lang",
    "crates/cargo-ice",
    "crates/ui",
    "examples/ai-chat",
    "examples/apple-music",
    "examples/candles",
    "examples/cef-browser",
    "examples/hotreload",
    "examples/iced-app",
    "examples/markdown-editor",
    "examples/showcase",
    "examples/starter",
    "examples/terminal",
    "examples/tray",
    "examples/trading",
    "conformance/ice",
]
resolver = "3"

[workspace.package]
edition = "2024"
homepage = "https://github.com/byeongsu-hong/ducktape-ui"
license = "MIT"
repository = "https://github.com/byeongsu-hong/ducktape-ui"
rust-version = "1.88"

[workspace.dependencies]
ducktape-ui = { path = "crates/ui", version = "=0.1.0" }
ui-lang = { path = "crates/ui-lang", version = "=0.1.0" }
ui-lang-build = { path = "crates/ui-lang-build", version = "=0.1.0" }
ui-lang-core = { path = "crates/ui-lang-core", version = "=0.1.0" }
ui-lang-runtime = { path = "crates/ui-lang-runtime", version = "=0.1.0" }
ui-lang-template = { path = "crates/ui-lang-template", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Debug info stays complete but lives beside the binary instead of inside it.
# Copying it in was the larger half of every dev link: showcase relinks 0.6s
# faster and its binary drops from 443MB to 158MB.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.music-example]
debug = 0

# `cargo run -p trading-example` is a debug build, and a debug frame on the
# terminal's densest screen was 11221us of build and layout against release's
# 3.3ms — the one reading in `docs/testing.md` with no headroom at 60Hz. This
# takes it to 7155us, and takes back nothing: touching a source file and
# rebuilding the crate is 2.51s against 2.58s at opt-level 0, because
# opt-level 0 hands LLVM more IR to lower than opt-level 1 does. A cold build
# of the graph goes 48s to 59s.
#
# `[profile.dev.package."*"] opt-level = 2` was measured on top of this and
# rejected. It takes the frame a further 0.82x, because a frame is iced's
# generic widget machinery monomorphized into the crate that *instantiates* it
# — this one — and a monomorphization is codegen'd at the instantiating crate's
# opt-level, not at iced's. So most of the frame is already here. What the
# dependency stanza does cost is every job in CI: on run 31359419019 `Rust and
# Ice` went 7m12s to 22m20s against a 30-minute cap, and every other dev job
# roughly tripled, because sccache misses everything on the changed flags.
[profile.dev.package.trading-example]
opt-level = 1

# Whole-program optimization pays twice here: showcase ships at 20.5MB instead
# of 33.0MB, and every frame phase drops 11-13% with p95 tightening 18% — the
# generated view is thousands of tiny calls into iced, which is exactly what
# cross-crate inlining is for. Release builds take 2.2x longer; nothing in the
# edit loop uses this profile, and the one CI job that does grows by a minute.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
