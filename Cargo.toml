[workspace]
members = [
    "crates/ui-lang-core",
    "crates/ui-lang-live-protocol",
    "crates/ui-lang-runtime",
    "crates/ui-lang",
    "crates/cargo-ice",
    "crates/ui",
    "examples/apple-music",
    "examples/cef-browser",
    "examples/iced-app",
    "examples/live-reload",
    "examples/markdown-editor",
    "examples/showcase",
    "conformance/ice",
]
exclude = [
    "vendor/block",
    "vendor/iced_core",
    "vendor/iced_graphics",
    "vendor/iced_highlighter",
    "vendor/iced_widget",
    "vendor/iced_wgpu",
    "vendor/iced_winit",
]
resolver = "3"

[patch.crates-io]
block = { path = "vendor/block" }
iced_core = { path = "vendor/iced_core" }
iced_graphics = { path = "vendor/iced_graphics" }
iced_highlighter = { path = "vendor/iced_highlighter" }
iced_widget = { path = "vendor/iced_widget" }
iced_wgpu = { path = "vendor/iced_wgpu" }
iced_winit = { path = "vendor/iced_winit" }

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package.apple-music-example]
debug = 0
