[package]
name = "viewcore"
version = "0.0.0"
edition = "2024"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "tiny-skia", "fira-sans"] }
iced_runtime = "=0.14.0"
iced_tiny_skia = "=0.14.0"
ui-lang-runtime = { path = "../../../../crates/ui-lang-runtime", default-features = false, features = ["full-runtime"] }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# winit refuses to compile on Linux with no platform selected; the guest never
# links winit's platform layer, so this stays off the wasm32 build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["x11", "thread-pool"] }
