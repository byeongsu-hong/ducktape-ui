[package]
name = "ui-lang-guest"
version = "0.1.0"
edition.workspace = true
description = "Runs a generated Ice application inside wasm as a view module: the tree it builds goes out, meaning-level events come in, and the component exports wrap both"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# No renderer feature on purpose: the guest builds a tree, it never draws.
# `advanced` is what the generated app's `Task`/`Theme` code names.
iced = { version = "=0.14.0", default-features = false, features = ["advanced"] }
iced_runtime = "=0.14.0"
ui-lang-wire.workspace = true
wit-bindgen = "0.57"

[lints.rust]
unsafe_code = "forbid"

# winit refuses a native target with no backend named, and iced pulls it in
# regardless of renderer; the guest's own tests run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["x11", "thread-pool"] }
