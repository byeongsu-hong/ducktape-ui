[package]
name = "ui-lang-runtime"
version = "0.1.0"
edition.workspace = true
description = "Native iced runtime and test support for generated Ice applications"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["full-runtime", "test-runtime"]
full-runtime = ["data-grid", "virtual-list"]
data-grid = ["virtual-list"]
virtual-list = []
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
x11 = ["iced/x11", "thread-pool"]
wayland = ["iced/wayland", "thread-pool"]
thread-pool = ["iced/thread-pool"]
test-runtime = [
    "dep:iced_test",
    "dep:iced_tiny_skia",
    "dep:png",
    "thread-pool",
    "tiny-skia",
    "wgpu",
    "x11",
]

[dependencies]
accesskit = "=0.24.1"
ouroboros = "0.18"
rustc-hash = "2.0"
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "qr_code"] }
stacker = "0.1"
iced_test = { version = "=0.14.0", optional = true }
iced_tiny_skia = { version = "=0.14.0", default-features = false, optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1.0", features = ["derive"] }
ui-lang-template.workspace = true
serde_json = "1"
unicode-segmentation = "1"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "=0.32.0"

[dev-dependencies]
dhat = "=0.3.3"
serde_json = "1"
stats_alloc = "0.1.10"

[lints]
workspace = true
