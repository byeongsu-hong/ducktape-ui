[package]
name = "ui-lang-runtime"
version = "0.1.0"
edition.workspace = true
description = "Native iced runtime and test support for generated Ice applications"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `test-runtime` is deliberately not a default: it drags the headless test
# driver (iced_test, png) and the wgpu renderer into every consumer's release
# graph. Test builds turn it on through a dev-dependency instead. `x11` stays
# because winit refuses to compile on Linux with no platform selected.
default = ["full-runtime", "x11"]
# `tiny-skia` here is load-bearing, not a renderer preference:
# `rich_text_editor` names the concrete paragraph type that only exists once
# a graphics backend is enabled.
full-runtime = ["data-grid", "tiny-skia"]
data-grid = []
wgpu = ["iced/wgpu"]
tiny-skia = ["iced/tiny-skia"]
x11 = ["iced/x11", "thread-pool"]
wayland = ["iced/wayland", "thread-pool"]
thread-pool = ["iced/thread-pool"]
# `cargo ice dev` turns this on; nothing else does. It is iced's `debug`
# feature: F12 debug metrics, and reporting for the `debug` spans Ice lowers.
devtools = ["iced/debug"]
test-runtime = [
    "dep:iced_test",
    "dep:iced_tiny_skia",
    "dep:png",
    "thread-pool",
    "tiny-skia",
    "wgpu",
    "x11",
]

[dependencies]
accesskit = "=0.24.1"
ouroboros = "0.18"
rustc-hash = "2.0"
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "qr_code"] }
stacker = "0.1"
iced_test = { version = "=0.14.0", optional = true }
iced_tiny_skia = { version = "=0.14.0", default-features = false, optional = true }
png = { version = "0.18", optional = true }
ui-lang-template.workspace = true
ui-lang-wire.workspace = true
serde_json = "1"
unicode-segmentation = "1"
zeroize = { version = "1", features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
# 0.26.3 is the newest release built against `accesskit` 0.24.1 — the exact
# version this crate pins — and it shares `accesskit_consumer` 0.38 with
# `accesskit_unix` 0.22.1's `accesskit_atspi_common`. 0.27 moved to
# `accesskit` 0.25 and cannot be used until the core pin moves with it.
accesskit_macos = "=0.26.3"
# Already in the graph via objc2; used only to hand a tree update's
# NSAccessibility notifications to the next main-queue turn, so raising them
# can never re-enter the winit event loop from inside one of its own frames.
dispatch2 = "=0.3.1"
# Already in the graph via tray-icon's `muda`; used for the safe main-thread
# checks guarding tray init and the NSAccessibility subclass.
objc2 = "0.6"
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "=0.32.0"

[dev-dependencies]
# Self dev-dependency: turns `test-runtime` on for this crate's own tests
# without putting it back in `default`.
ui-lang-runtime = { path = ".", features = ["test-runtime"] }
# Named directly so a test can reach the renderer's layers, which is where
# the patched crate's damage behaviour is observable.
iced_tiny_skia = { version = "=0.14.0", default-features = false }
# The renderer's own pixel buffer type, so a test can ask it for a partial
# repaint and read the result.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
serde_json = "1"
stats_alloc = "0.1.10"

# Not `workspace = true`. The workspace forbids unsafe Rust, and `forbid`
# cannot be lifted by an attribute; this crate needs exactly one unsafe call —
# `accesskit_macos::SubclassingAdapter::new`, which takes the `NSView` as a
# raw pointer — so it denies instead and that one call carries an `expect`
# with its safety argument. The workspace table holds this lint and nothing
# else, so nothing is lost by spelling it out.
[lints.rust]
unsafe_code = "deny"
