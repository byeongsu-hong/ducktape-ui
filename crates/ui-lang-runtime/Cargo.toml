[package]
name = "ui-lang-runtime"
version = "0.1.0"
edition.workspace = true
description = "Native iced runtime and test support for generated Ice applications"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["full-runtime", "test-runtime"]
full-runtime = ["virtual-list"]
virtual-list = []
test-runtime = [
    "dep:iced_test",
    "dep:iced_tiny_skia",
    "dep:png",
    "iced/thread-pool",
    "iced/tiny-skia",
    "iced/wgpu",
    "iced/x11",
]

[dependencies]
accesskit = "=0.24.1"
iced = { version = "=0.14.0", default-features = false, features = ["advanced", "canvas", "qr_code"] }
iced_test = { version = "=0.14.0", optional = true }
iced_tiny_skia = { version = "=0.14.0", default-features = false, optional = true }
png = { version = "0.18", optional = true }
serde_json = "1"
unicode-segmentation = "1"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = "=0.22.1"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = "=0.32.0"

[dev-dependencies]
dhat = "=0.3.3"
stats_alloc = "0.1.10"

[lints]
workspace = true
