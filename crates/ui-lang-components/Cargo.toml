[package]
name = "ui-lang-components"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composable iced components for Ducktape applications"
homepage.workspace = true
repository.workspace = true

[features]
default = []
wgpu = ["iced/wgpu", "ui-lang-runtime?/wgpu"]
tiny-skia = ["iced/tiny-skia", "ui-lang-runtime?/tiny-skia"]
x11 = ["iced/x11", "thread-pool", "ui-lang-runtime?/x11"]
wayland = ["iced/wayland", "thread-pool", "ui-lang-runtime?/wayland"]
thread-pool = ["iced/thread-pool", "ui-lang-runtime?/thread-pool"]
full = [
    "accordion",
    "alert",
    "alert-dialog",
    "aspect-ratio",
    "attachment",
    "avatar",
    "badge",
    "breadcrumb",
    "bubble",
    "button",
    "button-group",
    "calendar",
    "candle-chart",
    "card",
    "carousel",
    "chart",
    "checkbox",
    "collapsible",
    "combobox",
    "command",
    "context-menu",
    "data-table",
    "data-grid",
    "date-picker",
    "dialog",
    "direction",
    "drawer",
    "dropdown-menu",
    "empty",
    "field",
    "focus-control",
    "hover-card",
    "input",
    "input-group",
    "input-otp",
    "item",
    "kbd",
    "label",
    "log-timeline",
    "marker",
    "menu",
    "menubar",
    "message",
    "message-scroller",
    "modal",
    "native-select",
    "navigation-menu",
    "pagination",
    "popover",
    "progress",
    "radio-group",
    "resizable",
    "scroll-area",
    "segmented-control",
    "select",
    "separator",
    "sheet",
    "sidebar",
    "skeleton",
    "slider",
    "sonner",
    "spinner",
    "surface",
    "switch",
    "table",
    "tabs",
    "terminal",
    "textarea",
    "theme",
    "toggle",
    "toggle-group",
    "tooltip",
    "typography",
    "tree-view",
    "virtual-list",
]
theme = ["dep:iced"]
surface = ["theme"]
alert = ["theme"]
button = ["focus-control"]
input = ["theme"]
textarea = ["theme"]
checkbox = ["focus-control"]
field = ["theme"]
card = ["surface"]
badge = ["theme"]
empty = ["theme"]
progress = ["theme"]
separator = ["theme"]
segmented-control = ["button"]
aspect-ratio = ["theme"]
avatar = ["theme"]
breadcrumb = ["theme"]
item = ["theme"]
kbd = ["theme"]
label = ["theme"]
log-timeline = ["virtual-list"]
pagination = ["button"]
skeleton = ["theme"]
typography = ["theme"]
virtual-list = ["theme", "dep:ui-lang-runtime"]
tree-view = ["virtual-list"]
data-grid = ["table", "virtual-list", "ui-lang-runtime/data-grid"]
attachment = ["theme"]
bubble = ["theme"]
button-group = ["theme"]
direction = ["theme"]
input-group = ["input"]
marker = ["theme"]
message = ["theme"]
message-scroller = ["button", "focus-control", "theme"]
scroll-area = ["theme"]
spinner = ["theme"]
table = ["theme"]
accordion = ["focus-control"]
collapsible = ["focus-control"]
combobox = ["input"]
native-select = ["direction", "focus-control", "theme"]
data-table = ["table", "input", "checkbox", "pagination"]
focus-control = ["theme"]
calendar = ["button", "direction", "focus-control", "native-select", "theme"]
date-picker = ["calendar", "direction", "popover", "theme"]
carousel = ["direction", "focus-control", "theme"]
input-otp = ["focus-control"]
radio-group = ["focus-control"]
slider = ["focus-control"]
switch = ["focus-control"]
tabs = ["focus-control"]
# the pty engine + grid renderer; alacritty and tokio ride in with it.
terminal = ["dep:alacritty_terminal", "dep:iced", "dep:tokio"]
toggle = ["focus-control"]
toggle-group = ["toggle"]
resizable = ["focus-control"]
modal = ["theme"]
dialog = ["modal", "direction", "theme"]
alert-dialog = ["modal", "dialog", "direction", "focus-control", "button", "theme"]
sonner = ["theme", "focus-control"]
command = ["theme", "focus-control", "input", "scroll-area"]
chart = ["theme", "iced/canvas", "iced/svg"]
candle-chart = ["theme", "iced/canvas"]
popover = ["theme"]
navigation-menu = ["direction", "focus-control", "menu", "popover", "tooltip", "theme"]
tooltip = ["focus-control", "popover", "theme"]
hover-card = ["popover", "tooltip", "theme"]
sidebar = ["direction", "focus-control", "scroll-area", "skeleton", "tooltip", "popover", "theme"]
menu = ["direction", "focus-control", "theme"]
dropdown-menu = ["menu", "popover"]
context-menu = ["menu", "popover"]
menubar = ["menu", "popover", "focus-control"]
select = ["menu", "popover"]
sheet = ["modal", "direction", "theme"]
drawer = ["sheet", "modal", "theme"]

[dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false, optional = true }
iced = { version = "=0.14.0", default-features = false, features = ["advanced"], optional = true }
# NOT an exact pin: this crate is a library, and `=` on tokio would force
# every consumer's whole graph onto one patch release (the ducktape app resolves
# 1.52.3 and could not build against it).
tokio = { version = "1", optional = true, features = ["sync", "time"] }
ui-lang-runtime = { path = "../ui-lang-runtime", version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["thread-pool", "tiny-skia", "wgpu", "x11"] }
stats_alloc = "0.1.10"
# the terminal tests drive the pty pump on a current-thread runtime; the engine
# itself never builds one, so `rt` is a test-only need.
tokio = { version = "1", features = ["rt", "sync", "time"] }

[lints]
workspace = true
