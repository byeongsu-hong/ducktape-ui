[package]
name = "cargo-ice"
version = "0.1.0"
edition.workspace = true
description = "Cargo tooling and language server for the Ice UI language"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ctrlc = "3.5"
notify = "8.2.0"
plist = "1.10"
png = "0.18"
# An icon is shapes; without `text` this drops fontdb, rustybuzz, and the
# system font scan from every `cargo install cargo-ice`.
resvg = { version = "0.48", default-features = false }
same-file = "1.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
# `png-format` is not in resvg's own tiny-skia feature set, and the encoder is
# what un-premultiplies the rendered icon.
tiny-skia = { version = "0.12", features = ["png-format"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
ui-lang-core.workspace = true
ui-lang-template.workspace = true

[dev-dependencies]
stats_alloc = "0.1.10"
tempfile = "3.27"

[lints]
workspace = true
