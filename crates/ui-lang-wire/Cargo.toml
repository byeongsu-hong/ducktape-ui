[package]
name = "ui-lang-wire"
version = "0.1.0"
edition.workspace = true
description = "The wire between a host and an Ice app running in wasm: a widget tree out, meaning-level events in, requests and responses beside"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
authored-tests = []
manifest = ["dep:wasmparser"]
iced = ["dep:iced_core"]

[dependencies]
wasmparser = { version = "0.251", optional = true }
iced_core = { version = "=0.14.0", optional = true }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
memchr = "2"
unicode-segmentation = "1"

[lints]
workspace = true
