[package]
name = "ui-lang-core"
version = "0.1.0"
edition.workspace = true
description = "Parser, checker, formatter, and Rust code generator for the Ice UI language"
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
qrcode = { version = "=0.14.1", default-features = false }
sha2 = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
ui-lang-template.workspace = true

[dev-dependencies]
stats_alloc = "0.1.10"
tempfile = "3.27"
