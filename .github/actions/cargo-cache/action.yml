name: Cargo cache
description: >-
  Restores the cargo registry and build directory for one job. Jobs that build
  the same dependencies for the same target share a scope, because the
  repository's cache budget is a fixed pool: one entry three jobs restore beats
  three entries that evict each other.

inputs:
  scope:
    description: Cache identity. Jobs sharing a scope share one entry.
    required: false
    default: ${{ github.job }}-${{ strategy.job-index || 0 }}

runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: cargo-${{ runner.os }}-${{ inputs.scope }}-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ inputs.scope }}-
