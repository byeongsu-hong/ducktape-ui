name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - api/baselines/**
      - Cargo.lock
      - scripts/package-smoke.sh
      - scripts/downstream-package-smoke.sh
      - tests/downstream-app/**
      - crates/cargo-ice/**
      - crates/ui/**
      - crates/ui-lang/**
      - crates/ui-lang-build/**
      - crates/ui-lang-core/**
      - crates/ui-lang-runtime/**
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: Packaged downstream consumer
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/package-smoke.sh
      - run: scripts/downstream-package-smoke.sh
      - name: Verify release API baseline
        run: |
          committed=api/baselines/ducktape-ui.json
          current=target/release-ducktape-ui-api.json
          report=target/release-ducktape-ui-api-diff.json

          cargo ice api crates/ui/src/ice/default.ice > "$current"
          if ! cmp -- "$committed" "$current"; then
            echo "::error file=$committed::release API baseline is not the exact current fingerprint"
            diff -u -- "$committed" "$current" || true
            exit 1
          fi

          cargo ice api diff "$committed" "$current" --format json > "$report"
          if ! grep -Fq '"breaking": 0' "$report" ||
            ! grep -Fq '"behavioral_review": 0' "$report" ||
            ! grep -Fq '"additive": 0' "$report" ||
            ! grep -Fq '"changes": []' "$report"; then
            echo "::error file=$report::release API baseline did not produce an exact zero diff"
            cat "$report"
            exit 1
          fi

  build:
    name: cargo-ice (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          test "v$version" = "$GITHUB_REF_NAME"
          for manifest in crates/*/Cargo.toml; do
            test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest")" = "$version"
          done
      - run: cargo build --release --locked -p cargo-ice
      - name: Package archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          archive="cargo-ice-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "dist/$archive" cargo-ice
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "cargo-ice-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/cargo-ice.exe -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/$archive.sha256", "$hash  $archive`n")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-ice-${{ matrix.target }}
          path: dist/
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [build, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Ice ${GITHUB_REF_NAME#v}"
          fi
