name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - crates/cargo-ice/**
      - crates/ui-lang-core/**
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo-ice (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          test "v$version" = "$GITHUB_REF_NAME"
          for manifest in crates/*/Cargo.toml; do
            test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest")" = "$version"
          done
      - run: cargo build --release --locked -p cargo-ice
      - name: Package archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          archive="cargo-ice-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "dist/$archive" cargo-ice
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "cargo-ice-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/cargo-ice.exe -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "dist/$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-ice-${{ matrix.target }}
          path: dist/
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Ice ${GITHUB_REF_NAME#v}"
          fi
