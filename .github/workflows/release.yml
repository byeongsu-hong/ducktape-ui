name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - api/baselines/**
      - Cargo.lock
      - scripts/package-smoke.sh
      - scripts/downstream-package-smoke.sh
      - tests/downstream-app/**
      - crates/cargo-ice/**
      - crates/ui/**
      - crates/ui-lang/**
      - crates/ui-lang-build/**
      - crates/ui-lang-core/**
      - crates/ui-lang-runtime/**
      - crates/ui-lang-template/**
  push:
    tags: ["v*"]
  # Lets a maintainer exercise the signing and notarization path once, on a
  # branch, instead of finding out what it does on a release tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # apt bounds and retries its own downloads with these; without them a
  # stalled mirror holds the runner until the job's timeout.
  APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15

jobs:
  packages:
    name: Packaged downstream consumer
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: scripts/package-smoke.sh
      - run: scripts/downstream-package-smoke.sh
      - name: Verify release API baseline
        run: |
          committed=api/baselines/ducktape-ui.json
          current=target/release-ducktape-ui-api.json
          report=target/release-ducktape-ui-api-diff.json

          cargo ice api crates/ui/src/ice/default.ice > "$current"
          if ! cmp -- "$committed" "$current"; then
            echo "::error file=$committed::release API baseline is not the exact current fingerprint"
            diff -u -- "$committed" "$current" || true
            exit 1
          fi

          cargo ice api diff "$committed" "$current" --format json > "$report"
          if ! grep -Fq '"breaking": 0' "$report" ||
            ! grep -Fq '"behavioral_review": 0' "$report" ||
            ! grep -Fq '"additive": 0' "$report" ||
            ! grep -Fq '"changes": []' "$report"; then
            echo "::error file=$report::release API baseline did not produce an exact zero diff"
            cat "$report"
            exit 1
          fi

  build:
    name: cargo-ice (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          test "v$version" = "$GITHUB_REF_NAME"
          for manifest in crates/*/Cargo.toml; do
            test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest")" = "$version"
          done
      - run: cargo build --release --locked -p cargo-ice
      - name: Package archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          archive="cargo-ice-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "dist/$archive" cargo-ice
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "cargo-ice-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/cargo-ice.exe -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/$archive.sha256", "$hash  $archive`n")
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-ice-${{ matrix.target }}
          path: dist/
          compression-level: 0
          retention-days: 7

  app:
    name: Showcase disk image
    # A tag publishes it; a manual run is how a packaging change gets
    # exercised first. Pull requests skip it — the macOS bundling steps are
    # covered by `Workspace (macos-latest)` in CI, without two release builds.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # Two architectures through the release profile's fat LTO and single
    # codegen unit, with no compiler cache, is the whole cost of this job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the disk image
        run: |
          cargo ice bundle -p showcase \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Verify the bundle Gatekeeper will see
        run: |
          set -euo pipefail
          app=target/ice-bundle/Showcase.app
          test -f "$app/Contents/Resources/Showcase.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          archs="$(lipo -archs "$app/Contents/MacOS/showcase")"
          echo "architectures: $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "::error::the universal binary is missing arm64"; exit 1 ;;
          esac
          case " $archs " in
            *" x86_64 "*) ;;
            *) echo "::error::the universal binary is missing x86_64"; exit 1 ;;
          esac
          codesign --verify --strict --verbose=2 "$app"
      - name: Checksum the disk image
        run: |
          set -euo pipefail
          cd target/ice-bundle
          for image in *.dmg; do
            shasum -a 256 "$image" > "$image.sha256"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-macos
          path: |
            target/ice-bundle/*.dmg
            target/ice-bundle/*.dmg.sha256
          compression-level: 0
          retention-days: 7

  package:
    name: Showcase ${{ matrix.format }}
    # A tag publishes these; a manual run is how a packaging change gets
    # exercised first. Pull requests skip them — the staging layout and the
    # authoring are covered by unit contracts in CI on every commit.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # One release build of an iced application through the release profile's
    # fat LTO and single codegen unit, with no compiler cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            format: package
          - runner: windows-latest
            format: installer
    steps:
      - uses: actions/checkout@v7
      # `dpkg-shlibdeps` and `dpkg-deb` are already on the runner; only the
      # validator the verification step runs has to be installed.
      - name: Install the desktop entry validator
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          sudo apt-get $APT update
          sudo apt-get $APT install --yes --no-install-recommends desktop-file-utils
      - name: Install the WiX toolset
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 6.0.2
          # The global tool directory is not always on PATH for later steps.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the package
        run: cargo ice bundle -p showcase
      - name: Verify the Debian package
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          deb="$(ls target/ice-bundle/*.deb)"
          dpkg-deb --info "$deb"
          # `apt install` is what a user runs, and it is the step that fails if
          # a declared dependency cannot be satisfied on a clean machine.
          sudo apt-get install -y ${{ env.APT }} "$PWD/$deb"
          test -x /usr/bin/showcase
          desktop-file-validate /usr/share/applications/dev.ducktape.ui.showcase.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/dev.ducktape.ui.showcase.png
          sudo apt-get remove -y showcase
      - name: Verify the Windows installer
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/ice-bundle/*.msi)[0].FullName
          # A silent install and uninstall is the only check that proves the
          # authoring is valid rather than merely well-formed XML.
          $log = "$env:RUNNER_TEMP/install.log"
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$log`"" -Wait -NoNewWindow
          $installed = "$env:LOCALAPPDATA/Showcase/showcase.exe"
          if (-not (Test-Path $installed)) { Get-Content $log -Tail 40; throw "not installed" }
          Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -NoNewWindow
          if (Test-Path $installed) { throw "not uninstalled" }
      - name: Checksum the package
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          cd target/ice-bundle
          for artifact in *.deb; do
            sha256sum "$artifact" > "$artifact.sha256"
          done
      # The bash Windows runners provide is Git Bash, which carries no
      # `shasum`. This is the hash the `cargo-ice` archive job already uses.
      - name: Checksum the installer
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem target/ice-bundle/*.msi | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-${{ matrix.runner }}
          path: |
            target/ice-bundle/*.deb
            target/ice-bundle/*.msi
            target/ice-bundle/*.sha256
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [app, build, package, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.msi
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Ice ${GITHUB_REF_NAME#v}"
          fi
