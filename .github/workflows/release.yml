name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - api/baselines/**
      - Cargo.lock
      - scripts/package-smoke.sh
      - scripts/downstream-package-smoke.sh
      - tests/downstream-app/**
      - crates/cargo-ice/**
      - crates/ui/**
      - crates/ui-lang/**
      - crates/ui-lang-build/**
      - crates/ui-lang-core/**
      - crates/ui-lang-runtime/**
      - crates/ui-lang-template/**
  push:
    tags: ["v*"]
  # Lets a maintainer exercise the signing and notarization path once, on a
  # branch, instead of finding out what it does on a release tag.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    name: Packaged downstream consumer
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: scripts/package-smoke.sh
      - run: scripts/downstream-package-smoke.sh
      - name: Verify release API baseline
        run: |
          committed=api/baselines/ducktape-ui.json
          current=target/release-ducktape-ui-api.json
          report=target/release-ducktape-ui-api-diff.json

          cargo ice api crates/ui/src/ice/default.ice > "$current"
          if ! cmp -- "$committed" "$current"; then
            echo "::error file=$committed::release API baseline is not the exact current fingerprint"
            diff -u -- "$committed" "$current" || true
            exit 1
          fi

          cargo ice api diff "$committed" "$current" --format json > "$report"
          if ! grep -Fq '"breaking": 0' "$report" ||
            ! grep -Fq '"behavioral_review": 0' "$report" ||
            ! grep -Fq '"additive": 0' "$report" ||
            ! grep -Fq '"changes": []' "$report"; then
            echo "::error file=$report::release API baseline did not produce an exact zero diff"
            cat "$report"
            exit 1
          fi

  build:
    name: cargo-ice (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          test "v$version" = "$GITHUB_REF_NAME"
          for manifest in crates/*/Cargo.toml; do
            test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest")" = "$version"
          done
      - run: cargo build --release --locked -p cargo-ice
      - name: Package archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir dist
          archive="cargo-ice-${{ matrix.target }}.tar.gz"
          tar -C target/release -czf "dist/$archive" cargo-ice
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          $archive = "cargo-ice-${{ matrix.target }}.zip"
          Compress-Archive -Path target/release/cargo-ice.exe -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/$archive.sha256", "$hash  $archive`n")
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-ice-${{ matrix.target }}
          path: dist/
          compression-level: 0
          retention-days: 7

  app:
    name: Showcase disk image
    # A tag publishes it; a manual run is how the signing path gets exercised
    # first. Pull requests skip it — the macOS bundling steps are covered by
    # `Workspace (macos-latest)` in CI, without two release builds.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # Two architectures through the release profile's fat LTO and single
    # codegen unit, with no compiler cache, is the whole cost of this job.
    timeout-minutes: 120
    env:
      # An unset secret arrives as the empty string, which `cargo ice bundle`
      # reads as absent: the disk image is then signed ad hoc and not sent to
      # Apple, so the pipeline stays runnable before the secrets exist.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      ICE_CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      ICE_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      ICE_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/ice-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign prompts for keychain access and the job
          # hangs until its timeout instead of signing.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"
      - name: Stage the notary key
        if: env.MACOS_NOTARY_KEY != ''
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          echo "ICE_NOTARY_KEY=$key" >> "$GITHUB_ENV"
      - name: Build the signed disk image
        run: |
          cargo ice bundle -p showcase \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Verify the bundle Gatekeeper will see
        run: |
          set -euo pipefail
          app=target/ice-bundle/Showcase.app
          test -f "$app/Contents/Resources/Showcase.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          archs="$(lipo -archs "$app/Contents/MacOS/showcase")"
          echo "architectures: $archs"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "::error::the universal binary is missing arm64"; exit 1 ;;
          esac
          case " $archs " in
            *" x86_64 "*) ;;
            *) echo "::error::the universal binary is missing x86_64"; exit 1 ;;
          esac
          codesign --verify --strict --verbose=2 "$app"
      - name: Checksum the disk image
        run: |
          set -euo pipefail
          cd target/ice-bundle
          for image in *.dmg; do
            # A stapled ticket is what lets a first launch pass Gatekeeper on a
            # machine that cannot reach Apple, so it is checked, not assumed.
            if [ -n "${ICE_NOTARY_KEY:-}" ]; then
              xcrun stapler validate "$image"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$image"
            fi
            shasum -a 256 "$image" > "$image.sha256"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-macos
          path: |
            target/ice-bundle/*.dmg
            target/ice-bundle/*.dmg.sha256
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [app, build, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Ice ${GITHUB_REF_NAME#v}"
          fi
