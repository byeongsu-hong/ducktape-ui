name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` carry the api-breaking-approved decision; `edited`
    # only meant a retitled pull request paid for the whole matrix again.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ICED_TEST_BACKEND: tiny-skia
  # One content-keyed compiler cache for every job on every platform: the six
  # jobs that build overlapping dependency graphs stop paying for them twice.
  # sccache is an optimization, not a correctness gate: every sccache-action
  # step runs with continue-on-error (its binary download from GitHub releases
  # flakes, issue #595) followed by a guard that clears these two variables via
  # GITHUB_ENV when setup failed — the job then builds uncached but green
  # instead of every cargo call spawning a wrapper that never arrived.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # apt bounds and retries its own downloads with these; without them a
  # stalled mirror holds the runner until the job's timeout.
  APT: -o Acquire::Retries=3 -o Acquire::http::Timeout=15

jobs:
  validate:
    name: Rust and Ice
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - run: cargo ice fmt --check
      - name: Check complete Iced coverage ledger
        run: |
          if grep -Eq '^\|[^|]+\|[[:space:]]*(partial|missing)[[:space:]]*\|' COVERAGE.md; then
            echo "::error file=COVERAGE.md::the pinned Iced baseline has a partial or missing application-facing row"
            grep -En '^\|[^|]+\|[[:space:]]*(partial|missing)[[:space:]]*\|' COVERAGE.md
            exit 1
          fi
      - run: cargo ice clippy
      - name: Check public Ice API baseline
        env:
          # A label authorizes only the head that triggered its `labeled` event.
          # A later synchronize run must fail until a maintainer reapplies it.
          ICE_API_ACCEPT_BREAKING: ${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'api-breaking-approved' }}
          ICE_API_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          committed=api/baselines/ui-lang-components.json
          current=target/ui-lang-components-api.json
          cargo ice api crates/ui-lang-components/src/ice/default.ice > "$current"

          if ! cmp -- "$committed" "$current"; then
            echo "::error file=$committed::regenerate the committed API baseline with the documented cargo ice api command"
            diff -u -- "$committed" "$current" || true
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          if [[ ! "$ICE_API_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pull request base SHA is unavailable or malformed"
            exit 1
          fi

          baseline=target/ui-lang-components-api-base.json
          # The comparison point is whichever reviewed baseline the base commit
          # carries, found rather than assumed: a renamed crate moves the file,
          # and hardcoding today's path would make that rename unreviewable
          # against yesterday's. Exactly one must exist, so an added second
          # baseline is an error rather than an arbitrary choice.
          base_paths="$(git ls-tree --name-only "$ICE_API_BASE_SHA" api/baselines/)"
          if [[ "$(grep -c . <<< "$base_paths")" != "1" ]]; then
            echo "::error::the pull request base must carry exactly one reviewed Ice API baseline, found: ${base_paths:-none}"
            exit 1
          fi
          git show "$ICE_API_BASE_SHA:$base_paths" > "$baseline"
          cargo ice api diff "$baseline" "$baseline" > /dev/null
          if cargo ice api diff "$baseline" "$current"; then
            exit 0
          fi
          if [[ "$ICE_API_ACCEPT_BREAKING" != "true" ]]; then
            echo "::error::breaking Ice API changes require a maintainer to apply or reapply the api-breaking-approved label after the latest commit"
            exit 1
          fi
          echo "::notice::breaking Ice API change accepted for this head by the api-breaking-approved label event"
      - name: Check standalone UI feature on native and wasm
        run: |
          cargo check --locked -p ui-lang-runtime --no-default-features --features data-grid,x11
          cargo check --locked -p ui-lang-components --no-default-features --features button,data-grid,tree-view,virtual-list,x11
          cargo check --locked -p ui-lang-components --no-default-features --features log-timeline,x11
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p ui-lang-runtime --target wasm32-unknown-unknown --no-default-features --features data-grid
          cargo check --locked -p ui-lang-components --target wasm32-unknown-unknown --no-default-features --features button,data-grid,tree-view,virtual-list
          cargo check --locked -p ui-lang-components --target wasm32-unknown-unknown --no-default-features --features log-timeline
          cargo check --locked -p ui-lang-guest --target wasm32-unknown-unknown
      - name: Test native WGPU smoke harness
        run: |
          rustc --edition=2024 -D warnings --test scripts/native-wgpu-smoke.rs -o target/native-wgpu-smoke-tests
          target/native-wgpu-smoke-tests
      - run: cargo test --workspace --locked

  performance:
    name: Performance contracts
    runs-on: ubuntu-24.04
    # The longest job here, and the only one that compiles release artifacts,
    # which the fat LTO and single codegen unit in `[profile.release]` make
    # expensive. It also keeps `rust-cache` (alongside only the platforms
    # job): when every sccache job carried one, nine ~0.8GB entries held
    # 7.3GB of the 10GB Actions cache and this job's entry was evicted before
    # the next run read it — every run logged `No cache found`, so 20-24m of
    # cold work had four minutes of headroom. The Linux sccache jobs now rely
    # on sccache alone, leaving room for this entry to survive.
    timeout-minutes: 45
    env:
      # This job's product is wall-clock numbers, and sccache keeps a server
      # uploading to the Actions cache in the background. Measuring against a
      # 30ms budget while something else has the box is how a contract fails
      # for a reason that has nothing to do with the code under test.
      RUSTC_WRAPPER: ""
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          # Without this the job id joins the key and the shared one is moot.
          add-job-id-key: false
          # A warm restore measured 16.5m against 22.9m cold (runs 31550383286
          # vs 31554043656). `cache-workspace-crates: true` was tried on top
          # (#565) and reverted: with the enriched entry restored, a run whose
          # diff touched neither `crates/` nor `examples/trading` still took
          # 17m48s (run 31565394757) — the ~12m floor is `.ice` build-script
          # codegen plus fat-LTO test binaries, which a restored `target/`
          # does not let cargo skip here. The dependency-only entry is the
          # whole win; do not re-try the workspace-crates shape.
      - name: Run RichTextEditor performance contracts
        run: scripts/editor-performance-contracts.sh target/performance/rich-text-editor.jsonl
      - name: Upload RichTextEditor performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-text-editor-performance
          path: target/performance/rich-text-editor.jsonl
          if-no-files-found: error
      - name: Run remaining performance contracts
        run: |
          # Every ignored test in ui-lang-core and ui-lang-template is a
          # contract, so no name filter: `performance_contract` alone left
          # seven `allocation contract` tests never run in CI.
          cargo test --locked -p ui-lang-core -- --ignored --nocapture --test-threads=1
          cargo test --locked -p ui-lang-template -- --ignored --test-threads=1
          cargo test --locked -p ui-lang-runtime performance_contract -- --ignored --test-threads=1
          # `performance_contract`, not one test's name: naming the candle
          # chart's contract alone left the OTP allocation contract
          # (`tests/input_otp_allocations.rs`) never run in CI.
          cargo test --locked -p ui-lang-components --all-features performance_contract -- --ignored --nocapture --test-threads=1
          cargo test --release --locked -p ui-lang-runtime --test virtual_list_performance -- --ignored --nocapture --test-threads=1
          cargo test --release --locked -p ui-lang-runtime --test log_timeline_performance -- --ignored --nocapture --test-threads=1
          cargo test --release --locked -p ui-lang-runtime --test tree_view_performance -- --ignored --nocapture --test-threads=1
          cargo test --release --locked -p ui-lang-runtime --test data_grid_performance -- --ignored --nocapture --test-threads=1
          cargo test --release --locked -p ui-lang-runtime --test frame_probe -- --ignored --nocapture --test-threads=1
          cargo test --locked -p ui-lang-build performance_contract -- --ignored --test-threads=1
          cargo test --locked -p showcase --test derived_cache -- --ignored --nocapture --test-threads=1
          # Every ignored test in this crate is a contract, and naming two
          # filters here meant the five `allocation_contract_*` ones matched
          # neither and had never run in CI at all.
          cargo test --locked -p cargo-ice -- --ignored --nocapture --test-threads=1
      # Not a contract — a compile guard, and it belongs here because this is
      # the only job that already holds a release build of this crate. Nothing
      # else in CI builds the runtime's lib tests with `debug_assertions` off,
      # and the target had already rotted: `iced_core` implements `Renderer`
      # for `()` only under that cfg, so four tests standing a widget up
      # against the null renderer failed the whole target with 29 errors.
      - name: Test the runtime library in release
        run: cargo test --release --locked -p ui-lang-runtime --lib
      # The same guard for the examples' frame probes, which are
      # `#![cfg(not(debug_assertions))]` modules no debug job compiles: the
      # starter's had rotted against a generated message's new payload. A
      # type-check under the release cfg holds all ten; linking their fat-LTO
      # test binaries would cost this job minutes apiece.
      - name: Type-check the example frame probes in release
        run: cargo check --release --tests --locked -p ai-chat-example -p music-example -p candles-example -p browser-example -p hotreload-example -p markdown-example -p showcase -p ice-starter -p trading-example -p tray-example

  review:
    name: Review bundles and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - name: Verify full and selected review bundles
        run: |
          cargo ice review examples/showcase/src/ui/app.ice \
            --package showcase \
            --output target/ci-review/full
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          expected_key = "generated_control_accessibility/accessibility_contract.json"
          root = Path("target/ci-review")
          full_dir = root / "full"
          full = json.loads((full_dir / "report.json").read_text())

          selected_baseline = root / "selected-invalid-baseline"
          shutil.copytree(full_dir, selected_baseline)
          selected_report_path = selected_baseline / "report.json"
          selected_report = json.loads(selected_report_path.read_text())
          unselected = next(
              capture for capture in selected_report["captures"]
              if capture["key"] != expected_key
          )
          unselected["manifest"] = "missing/unselected.json"
          selected_report_path.write_text(json.dumps(selected_report, indent=2) + "\n")

          removed_baseline = root / "full-removed-baseline"
          shutil.copytree(full_dir, removed_baseline)
          removed_report_path = removed_baseline / "report.json"
          removed_report = json.loads(removed_report_path.read_text())
          source_capture = removed_report["captures"][0]
          removed_report["captures"].append({
              "key": "removed_fixture/obsolete.json",
              "name": "obsolete",
              "manifest": source_capture["manifest"],
              "png": source_capture["png"],
              "comparison": {"status": "not_requested"},
          })
          removed_report_path.write_text(json.dumps(removed_report, indent=2) + "\n")
          PY
          cargo ice review examples/showcase/src/ui/app.ice \
            --package showcase \
            --test generated_control_accessibility \
            --baseline target/ci-review/selected-invalid-baseline \
            --output target/ci-review/selected
          if cargo ice review examples/showcase/src/ui/app.ice \
            --package showcase \
            --baseline target/ci-review/full-removed-baseline \
            --output target/ci-review/full-removed-check; then
            echo "::error::full review accepted a removed baseline capture"
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_key = "generated_control_accessibility/accessibility_contract.json"

          def load_bundle(name):
              directory = Path("target/ci-review") / name
              for artifact in ("report.json", "report.html", "diagnostics.json"):
                  assert (directory / artifact).is_file(), (name, artifact)
              return directory, json.loads((directory / "report.json").read_text())

          full_dir, full = load_bundle("full")
          selected_dir, selected = load_bundle("selected")
          removed_dir, removed = load_bundle("full-removed-check")
          assert full["artifact_kind"] == "ice_review_bundle"
          assert full["schema_version"] == 2
          assert full["success"] is True
          assert expected_key in {capture["key"] for capture in full["captures"]}
          assert selected["artifact_kind"] == "ice_review_bundle"
          assert selected["schema_version"] == 2
          assert selected["success"] is True
          assert selected["tests"]["selected"] == ["generated_control_accessibility"]
          assert len(selected["captures"]) == 1
          capture = selected["captures"][0]
          assert capture["key"] == expected_key
          assert capture["comparison"]["status"] == "match"
          for field in ("manifest", "png"):
              assert (selected_dir / capture[field]).is_file(), field
          for field in ("report", "diff_png"):
              assert (selected_dir / capture["comparison"][field]).is_file(), field
          diff = json.loads(
              (selected_dir / capture["comparison"]["report"]).read_text()
          )
          assert diff["artifact_kind"] == "ice_capture_diff"
          accessibility = selected["accessibility"]
          assert accessibility["semantic_target_count"] > 0
          assert accessibility["named_semantic_target_count"] > 0
          assert accessibility["actionable_target_count"] > 0
          assert accessibility["actionable_without_name_count"] == 0
          assert all(
              capture["comparison"]["status"] != "removed"
              for capture in selected["captures"]
          )
          assert removed["artifact_kind"] == "ice_review_bundle"
          assert removed["success"] is False
          assert any(
              capture["key"] == "removed_fixture/obsolete.json"
              and capture["comparison"]["status"] == "removed"
              for capture in removed["captures"]
          )
          PY
      - name: Upload review bundle evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ice-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-review
          if-no-files-found: error
          retention-days: 7
      - run: cargo ice compat
      - run: scripts/package-smoke.sh
      - run: scripts/downstream-package-smoke.sh

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --locked

  platforms:
    name: Workspace (windows-latest)
    # macOS moved to the `macOS gate` job in the release workflow: the legs
    # here were 412 of the 836 macOS minutes a week against a five-slot
    # allowance, and everything they proved is now proved before a tag ships.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      # Measured exception to the sccache-only rule: this job builds many dev
      # test targets, where a restored `target/` lets cargo fingerprint-skip
      # compilation and linking outright. Without it the job ran 9-26m against
      # a 3.5m baseline (PR #551 runs 1-2); warm sccache still pays the graph
      # walk and every link.
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
      - name: Test native editor interactions
        run: |
          cargo test --locked -p ui-lang-runtime rich_text_editor --lib
          cargo test --locked -p markdown-example
      - name: Run baseline-free selected review smoke
        shell: bash
        run: |
          cargo ice review examples/showcase/src/ui/app.ice \
            --package showcase \
            --test generated_control_accessibility \
            --output target/platform-review

  accessibility:
    name: Accessibility (Linux and Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: |
          sudo apt-get $APT update
          sudo apt-get $APT install --yes at-spi2-core dbus-x11 gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - run: scripts/a11y-smoke.sh
      - run: scripts/a11y-windows-check.sh
      # The macOS signing helper only signs on a Mac, but the two judgements it
      # makes — which certificate is a development identity, and what bundle
      # identifier an App ID names — are string work, and getting either wrong
      # costs a round trip through Apple's portal to find out.
      - run: scripts/sign-dev.sh --self-test

  native-wgpu:
    name: Native WGPU (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            runner: ubuntu-24.04
            package: showcase
            executable: target/debug/showcase
            helper: target/native-wgpu-smoke
            backend: vulkan
            required_draw: virtual-list,tree-view,data-grid
          - label: Windows
            runner: windows-latest
            package: showcase
            executable: target/debug/showcase.exe
            helper: target/native-wgpu-smoke.exe
            backend: dx12
            required_draw: virtual-list,tree-view,data-grid
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
      ICE_DEV_REQUIRED_DRAW: ${{ matrix.required_draw }}
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - name: Install Linux display and Vulkan dependencies
        if: matrix.label == 'Linux'
        run: |
          sudo apt-get $APT update
          sudo apt-get $APT install --yes libvulkan1 libxkbcommon-x11-0 mesa-vulkan-drivers xauth
      - name: Build application and smoke harness
        shell: bash
        run: |
          # The overlap smoke below runs `cargo ice dev`, which builds with
          # `ui-lang-runtime/devtools`; that tree must be warm before its budget.
          # It runs first so the plain build leaves the shipped binary in place
          # for the first-frame step.
          if [ "${{ matrix.label }}" = "Linux" ]; then
            cargo build --locked -p showcase --features ui-lang-runtime/devtools
          fi
          cargo build --locked -p "${{ matrix.package }}"
          rustc --edition=2024 -D warnings scripts/native-wgpu-smoke.rs -o "${{ matrix.helper }}"
      - name: Draw first frame through Vulkan
        if: matrix.label == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" "${{ matrix.helper }}" "${{ matrix.executable }}"
      - name: Overlap cargo ice dev with cargo check
        if: matrix.label == 'Linux'
        run: timeout 360s xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" scripts/generated-output-overlap-smoke.sh
      - name: Draw first frame through native GPU backend
        if: matrix.label != 'Linux'
        shell: bash
        run: '"${{ matrix.helper }}" "${{ matrix.executable }}"'

  app-store:
    name: App store (guests + host)
    # examples/app-store is its own workspace (separate Cargo.toml and
    # Cargo.lock, on purpose — see its root comment): five guest apps that
    # compile to wasm32 and componentize into the catalog the host reads,
    # plus the wasmtime/iced host itself. Linux only, like the windowing
    # features (`x11`, `wayland`) the host's Cargo.toml gates on
    # `cfg(target_os = "linux")`.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: mozilla-actions/sccache-action@v0.0.11
        id: sccache
        continue-on-error: true
      - name: Disable sccache after failed setup
        if: steps.sccache.outcome == 'failure'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
      - run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-tools
        # componentize.sh shells out to `wasm-tools print`/`parse`/`component
        # new`/`strip`. A pinned release binary is faster than `cargo install`
        # (a from-source build of this crate is minutes on its own) and, like
        # every other tool version in this file, moves only when re-pinned.
        env:
          WASM_TOOLS_VERSION: 1.253.0
        run: |
          curl --retry 10 --retry-connrefused -fsSL \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar xz -C /tmp
          install -m 0755 "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version
      - name: Build guest apps for wasm32
        working-directory: examples/app-store
        run: |
          cargo build --locked -p app-store-todo -p app-store-counter -p app-store-clock \
            -p app-store-activity -p app-store-chaos \
            --release --target wasm32-unknown-unknown
      - name: Componentize the catalog
        working-directory: examples/app-store
        run: ./componentize.sh
      - name: Prove the catalog is real
        working-directory: examples/app-store
        run: |
          shopt -s nullglob
          catalog=(target/app-store-catalog/*.wasm)
          echo "catalog components: ${#catalog[@]}"
          printf '%s\n' "${catalog[@]}"
          if [ "${#catalog[@]}" -lt 5 ]; then
            echo "::error::expected at least 5 componentized apps in the catalog, found ${#catalog[@]}"
            exit 1
          fi
      - name: Lint the app-store workspace
        working-directory: examples/app-store
        run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      - name: Test the app-store workspace
        working-directory: examples/app-store
        run: cargo test --locked --workspace
