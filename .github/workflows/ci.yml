name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Rust and Ice
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo ice fmt --check
      - run: cargo ice clippy
      - name: Check standalone UI feature on native and wasm
        run: |
          cargo check --locked -p ducktape-ui --no-default-features --features button,x11
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p ducktape-ui --target wasm32-unknown-unknown --no-default-features --features button
      - run: cargo test --workspace --locked
      - run: cargo ice compat

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --workspace --locked

  platforms:
    name: Workspace (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo check --workspace --locked

  accessibility:
    name: Accessibility (Linux and Windows)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes at-spi2-core dbus-x11
          rustup target add x86_64-pc-windows-gnu
      - run: scripts/a11y-smoke.sh
      - run: scripts/a11y-windows-check.sh
