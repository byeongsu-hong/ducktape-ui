[package]
name = "ice-ui-conformance"
version = "0.1.0"
edition.workspace = true
publish = false

[dependencies]
iced = { version = "=0.14.0", features = ["smol"] }
ui-lang.workspace = true
ui-lang-runtime.workspace = true

[build-dependencies]
ui-lang-build.workspace = true

[dev-dependencies]
ui-lang-runtime = { workspace = true, features = ["test-runtime"] }
ui-lang-components = { workspace = true, features = ["button", "theme"] }
iced_test = "=0.14.0"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
